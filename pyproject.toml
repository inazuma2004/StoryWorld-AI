[project]
name = "storyworld-ai"
version = "0.1.0"
description = "Plateforme intelligente de création de bandes dessinées par IA générative"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "streamlit>=1.41",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "pillow>=10.4",
    "reportlab>=4.2",
    "httpx>=0.27",
    "tenacity>=8.2",
    "google-genai>=1.0",
    "openai>=1.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "respx>=0.19",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
